org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

extType=music
extId=deezer
extClass=DeezerExtension

extIconUrl=https://cdn-files.dzcdn.net/img/common/og-deezer-logo.png
extName=Deezer
extDescription=Deezer Extension for Echo.

extAuthor=TheWinner02
extAuthorUrl=https://github.com/TheWinner02

extRepoUrl=https://github.com/TheWinner02/echo-deezer-extension
extUpdateUrl=https://api.github.com/repos/TheWinner02/echo-deezer-extension/releases

# Progressive versioning variables
extVersionCode=1
extVersionName=v1.0.1

android.defaults.buildfeatures.resvalues=false
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true
android.enableAppCompileTimeRClass=true
android.usesSdkInManifest.disallowed=true
android.uniquePackageNames=false
android.dependency.useConstraints=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true
android.builtInKotlin=false
android.newDsl=false